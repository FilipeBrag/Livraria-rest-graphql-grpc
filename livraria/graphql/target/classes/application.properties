spring.application.name=livraria-graphql
server.port=8081

# H2 em memória
spring.datasource.url=jdbc:h2:mem:livraria
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.show-sql=false

# GraphQL
# Habilita o GraphiQL — interface visual no browser para testar queries
# Acesse: http://localhost:8081/graphiql
spring.graphql.graphiql.enabled=true
spring.graphql.graphiql.path=/graphiql

# Habilita introspection (desabilitar em produção)
spring.graphql.schema.introspection.enabled=true
